<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>卑弥呼と受験対策 | JUKEN CAMP</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    html { height:100%; overflow:hidden; background:#fff; }
    html, body { overflow-x:hidden; max-width:100%; }
    body { font-family:'M PLUS Rounded 1c',sans-serif; background:#fff; height:100%; overflow-y:auto; }
    .hidden{display:none!important}
    #list-view{min-height:100vh;background:#f0f4ff}
    #chat-view{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;max-width:100%;background:#fff;}
    .input-area{padding:11px 12px calc(20px + env(safe-area-inset-bottom, 0px));background:#fff;border-top:2px solid #f1f5f9;flex-shrink:0;}
    .header{background:#fff;border-bottom:3px solid #e2e8f0;padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.07)}
    .header-inner{max-width:700px;margin:0 auto;padding:12px 0;display:flex;align-items:center;gap:12px}
    .logo-box{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:12px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    #search-input{background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;padding:8px 14px;font-size:13px;color:#1e293b;width:155px;font-family:inherit;min-width:0}
    @media (max-width:375px){#search-input{width:100px;padding:8px 10px}}
    @media (max-width:320px){#search-input{width:75px;padding:8px 8px;font-size:12px}}
    .main-content{max-width:700px;margin:0 auto;padding:16px 12px 80px}
    .hero{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#a78bfa 100%);border-radius:20px;padding:22px 20px;margin-bottom:18px;animation:fadeUp 0.5s;position:relative;overflow:hidden}
    .hero-bg{position:absolute;right:-10px;top:-10px;font-size:90px;opacity:0.08;animation:float 4s ease-in-out infinite}
    .tag-bar{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0}
    .tag-btn{flex:0 0 auto;padding:8px 16px;border-radius:100px;border:2px solid #e2e8f0;background:#fff;color:#64748b;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;transition:all 0.2s}
    .tag-btn.active{border-color:#6366f1;background:#6366f1;color:#fff}
    .fav-btn{font-size:20px;color:#cbd5e1;cursor:pointer;transition:all 0.2s;line-height:1;padding:4px;flex-shrink:0;align-self:center}
    .fav-btn.faved{color:#f59e0b}
    @media(hover:hover){.fav-btn:hover{color:#f59e0b;transform:scale(1.2)}}
    .card-list{display:flex;flex-direction:column;gap:9px}
    .char-card{background:#fff;border:2px solid #f1f5f9;border-radius:16px;padding:13px 15px;cursor:pointer;text-align:left;transition:all 0.18s;width:100%;box-shadow:0 1px 6px rgba(0,0,0,0.05);animation:fadeUp 0.4s ease-out both}
    .char-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.10)}
    .card-inner{display:flex;align-items:center;gap:13px}
    .avatar{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0;position:relative}
    .online-dot{position:absolute;bottom:-1px;right:-1px;background:#22c55e;border-radius:50%;width:11px;height:11px;border:2px solid #fff}
    .card-info{flex:1;min-width:0}
    .card-name-row{display:flex;align-items:center;gap:7px;margin-bottom:3px}
    .card-tag{font-size:10px;padding:2px 8px;border-radius:100px;font-weight:800;flex-shrink:0}
    .online-badge{font-size:10px;padding:2px 7px;border-radius:100px;background:#dcfce7;color:#16a34a;font-weight:800}
    .explainer-badge{font-size:10px;padding:2px 7px;border-radius:100px;background:#ede9fe;color:#6d28d9;font-weight:800;border:1px solid #ddd6fe}
    .narrator-badge{font-size:10px;padding:2px 7px;border-radius:100px;background:#ede9fe;color:#6d28d9;font-weight:800;border:1px solid #ddd6fe}
    .chat-header{background:#fff;border-bottom:2px solid #f1f5f9;padding:10px 14px;display:flex;align-items:center;gap:11px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:relative;z-index:10;}
    .back-btn{background:none;border:none;padding:4px 8px 4px 0;color:#94a3b8;cursor:pointer;font-size:20px;font-weight:700;line-height:1;flex-shrink:0;transition:color 0.15s}
    .back-btn:active{color:#6366f1}
    .chat-avatar{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
    .messages{flex:1;min-height:0;overflow-y:auto;overflow-anchor:none;padding:14px 12px 22px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#f0f4ff;}
    .messages-inner{max-width:700px;margin:0 auto;}
    .bio-card{background:#fff;border-radius:16px;padding:13px 15px;margin-bottom:12px;animation:fadeUp 0.4s}
    .bio-inner{display:flex;gap:10px;align-items:flex-start}
    /* 質問候補は送信メッセージと同じ右側に配置 */
    .suggestions{display:flex;flex-direction:column;align-items:flex-end;gap:7px;margin:14px 0 18px 38px;animation:messageArrive .32s ease-out both;}
    .suggestions-label{font-size:11px;color:#64748b;font-weight:700;text-align:right;}
    .suggestions-list{display:flex;flex-direction:column;align-items:flex-end;width:100%;gap:8px;}
    .suggestion-btn{display:block;width:fit-content;max-width:94%;min-height:40px;background:#fff;border-radius:16px 16px 5px 16px;padding:9px 13px;font-size:12px;line-height:1.7;font-weight:700;cursor:pointer;transition:transform .13s,background-color .13s,box-shadow .13s;text-align:left;overflow-wrap:anywhere;touch-action:manipulation;box-shadow:0 2px 6px rgba(0,0,0,.035);}
    .suggestion-btn:active{transform:translateY(1px) scale(.98);background:#f8fafc;box-shadow:none;}
    .suggestion-btn:focus-visible,.reveal-skip:focus-visible{outline:2px solid #4f46e5;outline-offset:3px;}
    @media(hover:hover){.suggestion-btn:hover{background:#f8fafc;}}
    .bubble-group{margin-bottom:14px;}
    .bubble-row{display:flex;margin-bottom:10px;gap:8px;align-items:flex-end;}
    .bubble-row.user{justify-content:flex-end;margin-bottom:15px;}
    .bubble-row.is-new{animation:messageArrive .28s cubic-bezier(.2,.75,.2,1) both;}
    .bubble-row.continuation{margin-top:-3px;}
    .bubble-avatar,.bubble-avatar-spacer{width:33px;min-width:33px;height:33px;flex-shrink:0;}
    .bubble-avatar{border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;}
    .bubble{max-width:82%;padding:11px 15px;font-size:14px;line-height:1.85;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere;}
    .bubble.user{border-radius:18px 18px 4px 18px;color:#fff;}
    .bubble.assistant{border-radius:18px 18px 18px 4px;background:#fff;color:#1e293b;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
    .typing{padding:12px 16px;border-radius:18px 18px 18px 4px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.06);display:flex;gap:5px;align-items:center;min-height:40px;}
    .typing-dot{width:7px;height:7px;border-radius:50%;animation:himikoTyping 1.1s ease-in-out infinite;}
    .reveal-status{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:82%;margin:1px 0 12px 41px;}
    .reveal-dots{display:flex;align-items:center;gap:5px;padding:8px 9px;min-height:36px;}
    .reveal-skip{border:1px solid #cbd5e1;background:#fff;color:#475569;padding:7px 11px;border-radius:999px;font:700 11px 'M PLUS Rounded 1c',sans-serif;cursor:pointer;white-space:nowrap;min-height:36px;}
    .reveal-skip:active{transform:scale(.97);}
    @keyframes messageArrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    @keyframes himikoTyping{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
    @media(prefers-reduced-motion:reduce){.bubble-row.is-new,.suggestions,.typing-dot{animation:none!important}.suggestion-btn,.reveal-skip{transition:none!important}}
    .error-msg{text-align:center;padding:9px 14px;background:#fef2f2;border:2px solid #fecaca;border-radius:12px;color:#ef4444;font-size:12px;font-weight:700;margin-bottom:11px}
    .input-inner{display:flex;gap:8px;max-width:640px;margin:0 auto;align-items:flex-end}
    #msg-input{flex:1;background:#f8fafc;border:2px solid #e2e8f0;border-radius:13px;padding:11px 15px;font-size:14px;line-height:1.6;font-family:inherit;color:#1e293b;transition:border-color 0.2s}
    .send-btn{width:44px;height:44px;border-radius:13px;border:none;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
    .send-btn:disabled{background:#f1f5f9;color:#94a3b8;cursor:default;box-shadow:none}
    .empty-state{text-align:center;padding:40px;color:#94a3b8}
    /* プロフィールモーダル */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn 0.2s}
    .modal-overlay.closing{animation:fadeOut 0.2s forwards}
    .modal-sheet{background:#fff;border-radius:24px 24px 0 0;padding:20px 20px 36px;width:100%;max-width:700px;animation:slideUp 0.28s cubic-bezier(0.34,1.56,0.64,1)}
    .modal-sheet.closing{animation:slideDown 0.22s ease-in forwards}
    .modal-handle{width:40px;height:4px;background:#e2e8f0;border-radius:4px;margin:0 auto 18px}
    .modal-close{float:right;background:#f1f5f9;border:none;border-radius:10px;padding:6px 12px;font-size:12px;font-weight:800;color:#64748b;cursor:pointer}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeOut{from{opacity:1}to{opacity:0}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes slideDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
    .header-tap{cursor:pointer;display:flex;align-items:center;gap:10px;flex:1;padding:4px 6px;border-radius:12px;transition:background 0.15s}
    .header-tap:active{background:#f1f5f9}
    .info-hint{font-size:10px;color:#94a3b8;font-weight:700;margin-top:1px}
    .chat-header .header-tap{min-width:0}
    .chat-reset{flex-shrink:0;padding:7px 9px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;color:#475569;font:800 11px 'M PLUS Rounded 1c',sans-serif;cursor:pointer;white-space:nowrap}
    .chat-reset:disabled{opacity:.4;cursor:default}
    .chat-reset:focus-visible,.older-history:focus-visible{outline:2px solid #6366f1;outline-offset:3px}
    .chat-storage-status{min-height:19px;padding:3px 13px 4px;border-bottom:1px solid #edf2f7;background:#fff;color:#64748b;font-size:10px;font-weight:700;text-align:right;flex-shrink:0}
    .chat-storage-status[data-state="error"]{color:#b91c1c;background:#fff7f7}
    .older-history{display:block;max-width:270px;margin:4px auto 18px;padding:8px 13px;border:1px solid #c7d2fe;border-radius:999px;background:#fff;color:#4f46e5;font:800 12px 'M PLUS Rounded 1c',sans-serif;cursor:pointer}
    .history-loading{padding:24px;text-align:center;color:#64748b;font-weight:700;font-size:12px}
    @media(max-width:360px){#chat-name{font-size:13px!important}.chat-reset{padding:6px 7px;font-size:10px}.chat-header{gap:5px;padding:7px 9px}.chat-avatar{width:35px;height:35px;font-size:19px}}
    @media(prefers-reduced-motion:reduce){.older-history,.chat-reset{transition:none}}
  </style>
</head>
<body>

<!-- LIST VIEW -->

<div id="list-view">
  <div class="header">
    <div class="header-inner">
      <div style="flex:1;display:flex;align-items:center;gap:10px">
        <div class="logo-box">🌙</div>
        <div>
          <div style="font-weight:900;font-size:18px;color:#1e293b;letter-spacing:-0.5px">卑弥呼と受験対策</div>
          <div style="font-size:10px;color:#6366f1;font-weight:800;letter-spacing:1px">JUKEN CAMP × AI</div>
        </div>
      </div>
      <input id="search-input" placeholder="🔍 名前・時代で検索" oninput="renderCards()">
    </div>
  </div>
  <div class="main-content">
    <div class="hero">
      <div class="hero-bg">🌙</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.8);font-weight:800;letter-spacing:3px;margin-bottom:6px">中学の歴史 × AI先生</div>
      <h1 style="font-size:clamp(19px,5vw,26px);font-weight:900;color:#fff;line-height:1.35;margin-bottom:10px">歴史を学ぶなら<br>卑弥呼と受験対策！</h1>
      <p style="font-size:13px;color:rgba(255,255,255,0.85);line-height:1.7">AI先生が今度は歴史上の人物に変身⚡️</p>
    </div>
    <div class="tag-bar" id="tag-bar"></div>
    <div class="card-list" id="card-list"></div>
  </div>
</div>

<!-- CHAT VIEW -->

<div id="chat-view" class="hidden">
  <div class="chat-header">
    <button class="back-btn" onclick="showList()">＜</button>
    <div class="header-tap" onclick="showProfile()" id="header-tap">
      <div class="chat-avatar" id="chat-avatar"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:900;font-size:16px;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="chat-name"></div>
        <div style="font-size:11px;color:#94a3b8" id="chat-period"></div>
      </div>
    </div>
    <div id="online-badge" class="hidden online-badge">🟢 オンライン</div>
    <div id="explainer-badge" class="hidden" style="display:flex;flex-direction:column;gap:3px;flex-shrink:0">
      <span class="explainer-badge">📖 解説モード</span>
      <span class="explainer-badge" style="background:#fef3c7;color:#92400e;border-color:#fde68a">⚠️ 歴史的教訓</span>
    </div>
    <div id="narrator-badge" class="hidden" style="display:flex;flex-direction:column;gap:3px;flex-shrink:0">
      <span class="narrator-badge">📖 解説モード</span>
      <span class="narrator-badge" style="background:#dcfce7;color:#166534;border-color:#bbf7d0">🕊️ 敬意配慮</span>
    </div>
    <button class="chat-reset" id="chat-reset" type="button" onclick="resetCurrentChat()" disabled>新しい会話</button>
  </div>
  <div id="chat-storage-status" class="chat-storage-status" role="status" aria-live="polite">会話を読み込み中…</div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-inner">
      <textarea maxlength="2000" id="msg-input" rows="1" placeholder="質問してみよう！"></textarea>
      <button class="send-btn" id="send-btn" onclick="handleSend()" disabled>↑</button>
    </div>

  </div>
</div>

<!-- PROFILE MODAL -->

<div id="profile-modal" class="hidden"></div>

const allChars=[AI_SENSEI,...CHARACTERS];
let currentTag="all",currentChar=null,messages=[],isLoading=false,dynamicSuggestions=[];
let chatEpoch=0,activeReveal=null,userReadingHistory=false,previousChatScroll=0;
let automaticChatScrollUntil=0;
let chatReady=false,historyVisiblePairs=40;
const HISTORY_PAGE_PAIRS=40;
// 生徒が多くの会話を保存しても、AIには直近の完了した会話だけを渡す。
// 全履歴はIndexedDBに残り、画面でも「過去の会話を表示」から遡れる。
const AI_CONTEXT_MAX_PAIRS=10,AI_CONTEXT_MAX_CHARS=11000;
const CHAT_DB_NAME="himiko-conversations-v1",CHAT_DB_STORE="conversations";
let chatDbPromise=null,chatWrites=Promise.resolve();
function setChatStorageStatus(text,state="ok"){
  const el=document.getElementById("chat-storage-status");
  el.textContent=text;el.dataset.state=state;
}
function openChatDB(){
  if(!chatDbPromise){
    chatDbPromise=new Promise((resolve,reject)=>{
      if(!("indexedDB" in window)){reject(new Error("IndexedDB is not available"));return;}
      const req=indexedDB.open(CHAT_DB_NAME,1);
      req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(CHAT_DB_STORE))req.result.createObjectStore(CHAT_DB_STORE,{keyPath:"id"});};
      req.onsuccess=()=>{const db=req.result;db.onversionchange=()=>db.close();resolve(db);};
      req.onerror=()=>reject(req.error||new Error("DB open failed"));
      req.onblocked=()=>reject(new Error("DB blocked"));
    }).catch(err=>{chatDbPromise=null;throw err;});
  }
  return chatDbPromise;
}
async function readSavedChat(id){
  // 書き込み直後に人物を切り替えても、古いデータを先に読まない。
  await chatWrites.catch(()=>{});
  const db=await openChatDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(CHAT_DB_STORE,"readonly"),req=tx.objectStore(CHAT_DB_STORE).get(String(id));
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error||new Error("Read failed"));
    tx.onabort=()=>reject(tx.error||new Error("Read aborted"));
  });
}
function writeSavedChat(id,record){
  // 登録と削除の順序を保証する。書き込み完了前に保存済みとは表示しない。
  const operation=chatWrites.catch(()=>{}).then(async()=>{
    const db=await openChatDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(CHAT_DB_STORE,"readwrite");
      const store=tx.objectStore(CHAT_DB_STORE);
      if(record)store.put({id:String(id),version:1,updatedAt:Date.now(),turns:record.turns,suggestions:record.suggestions});
      else store.delete(String(id));
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error("Write failed"));
      tx.onabort=()=>reject(tx.error||new Error("Write aborted"));
    });
  });
  chatWrites=operation;
  return operation;
}
function completedChatTurns(source=messages){
  const result=[];
  // 先頭の挨拶や未完了・エラーの回答は保存／AIの記憶に含めない。
  for(let i=1;i+1<source.length;i++){
    const user=source[i],answer=source[i+1];
    if(user?.role==="user"&&answer?.role==="assistant"&&
       typeof user.content==="string"&&user.content.trim()&&
       typeof answer.content==="string"&&answer.content.trim()&&
       !answer.content.startsWith("⚠️ 接続エラー")){
      result.push({role:"user",content:user.content},{role:"assistant",content:answer.content});i++;
    }
  }
  return result;
}
function persistCurrentChat(ch=currentChar){
  if(!ch)return Promise.resolve();
  const record={turns:completedChatTurns(),suggestions:[...dynamicSuggestions]};
  const epoch=chatEpoch;
  setChatStorageStatus("保存中…");
  return writeSavedChat(ch.id,record.turns.length?record:null).then(()=>{
    if(epoch===chatEpoch&&currentChar===ch)setChatStorageStatus("✓ この端末に会話を保存済み");
  }).catch(err=>{
    console.warn("会話を保存できませんでした",err);
    if(epoch===chatEpoch&&currentChar===ch)setChatStorageStatus("⚠️ 会話を保存できません。ブラウザの保存設定をご確認ください","error");
  });
}
function buildApiConversation(question){
  const turns=completedChatTurns();
  const selected=[];
  let length=question.length;
  // 古い発言のみが単独で混入しないよう、user / assistantのペア単位で切り詰める。
  for(let i=turns.length-2;i>=0&&selected.length<AI_CONTEXT_MAX_PAIRS*2;i-=2){
    const pairLength=turns[i].content.length+turns[i+1].content.length;
    if(length+pairLength>AI_CONTEXT_MAX_CHARS)break;
    selected.unshift(turns[i],turns[i+1]);length+=pairLength;
  }
  return [...selected,{role:"user",content:question}];
}
async function resetCurrentChat(){
  const ch=currentChar;if(!ch||!chatReady||isLoading)return;
  if(!confirm(`${ch.name}との保存済みの会話を削除して、新しい会話を始めますか？\nこの操作は取り消せません。`))return;
  chatEpoch++;cancelReveal(false);isLoading=false;
  messages=[{role:"assistant",content:ch.greeting}];dynamicSuggestions=[];historyVisiblePairs=HISTORY_PAGE_PAIRS;
  document.getElementById("msg-input").value="";
  renderMessages();
  persistCurrentChat(ch);
}
function showOlderHistory(){
  if(!chatReady||!currentChar)return;
  // 再描画で進行中のバブルが切り離されないよう、全文を先に表示する。
  cancelReveal(true,true);
  const el=document.getElementById("messages"),oldHeight=el.scrollHeight,oldTop=el.scrollTop;
  historyVisiblePairs+=HISTORY_PAGE_PAIRS;
  // 古い履歴を追加しても、現在読んでいる位置を保持する。
  renderMessages(false);
  el.scrollTop=oldTop+el.scrollHeight-oldHeight;
  userReadingHistory=true;previousChatScroll=el.scrollTop;
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")}
function escAttr(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/'/g,"&#39;")}


function getEra(period) {
  const y=(function(){
    const bc=period.match(/紀元前(\d+)/);if(bc)return -parseInt(bc[1]);
    const m=period.match(/[（(](\d{3,4})/);if(m)return parseInt(m[1]);
    if(period.includes('3世紀'))return 250;if(period.includes('5世紀'))return 450;return 9999;
  })();
  if(y<600)return{id:"古代",label:"古代",color:"#92400E",bg:"#FDE68A"};
  if(y<1300)return{id:"中世",label:"中世",color:"#1E40AF",bg:"#BFDBFE"};
  if(y<1700)return{id:"近世",label:"近世",color:"#065F46",bg:"#6EE7B7"};
  if(y<1900)return{id:"近代",label:"近代",color:"#6D28D9",bg:"#DDD6FE"};
  return{id:"現代",label:"現代",color:"#0E7490",bg:"#A5F3FC"};
}

function toggleFav(id,ev){if(ev){ev.stopPropagation();ev.preventDefault();}const s=getFavs();if(s.has(id))s.delete(id);else s.add(id);saveFavs(s);renderTags();renderCards();}
function isFav(id){return getFavs().has(id);}

function renderTags(){
  document.getElementById("tag-bar").innerHTML=TAGS.map(t=>{
    const eraTags=["古代","中世","近世","近代","現代"];const cnt=t.id==="all"?allChars.length:t.id==="fav"?getFavs().size:t.id==="special"?1:t.id==="kaisetsu"?CHARACTERS.filter(c=>c.isExplainer||c.isNarrator).length:t.id==="explainer"?CHARACTERS.filter(c=>c.isExplainer).length:t.id==="narrator"?CHARACTERS.filter(c=>c.isNarrator).length:eraTags.includes(t.id)?CHARACTERS.filter(c=>getEra(c.period).id===t.id).length:CHARACTERS.filter(c=>c.tag===t.id).length;
    return`<button class="tag-btn${currentTag===t.id?" active":""}" onclick="setTag('${t.id}')">${t.emoji} ${t.label} <span style="opacity:.65;font-size:11px">(${cnt})</span></button>`;
  }).join("");
}

function setTag(id){currentTag=id;renderTags();renderCards();}

  if(q)list=list.filter(c=>c.name.toLowerCase().includes(q)||c.period.toLowerCase().includes(q)||c.catchphrase.toLowerCase().includes(q));

      <div class="card-inner">
        <div class="avatar" style="background:linear-gradient(135deg,${ch.color},${ch.accent});${anim}">

          </div>
          <div style="font-size:11px;color:#94a3b8;margin-bottom:3px;display:flex;align-items:center;gap:5px">${esc(ch.period)}${hasNarrator?`<span class="narrator-badge">📖 解説</span>`:""}</div>
          <div style="font-size:12px;font-weight:700;color:${ch.color};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ai?"💬 ":""}${esc(ch.catchphrase)}</div>
        </div>
        <span class="fav-btn${faved?" faved":""}" onclick="toggleFav(${ch.id},event)" title="お気に入り">${faved?"★":"☆"}</span>
      </div>
    </button>`;
  }).join("");
}

let listScrollY=0;

  updateSendBtn();
  try{
    const saved=await readSavedChat(ch.id);

    const savedTurns=Array.isArray(saved?.turns)?saved.turns:[];
    // 壊れた形式の保存データをチャット／APIに流さない。
    const validTurns=completedChatTurns([{role:"assistant",content:ch.greeting},...savedTurns]);
    messages=[{role:"assistant",content:ch.greeting},...validTurns];
    dynamicSuggestions=validTurns.length&&Array.isArray(saved?.suggestions)?saved.suggestions.filter(x=>typeof x==="string"&&x.length<150).slice(0,3):[];
    setChatStorageStatus(validTurns.length?"✓ この端末の会話を復元しました":"✓ この端末に会話を自動保存");
  }catch(err){
    console.warn("会話を読み込めませんでした",err);
    if(epoch!==chatEpoch||currentChar!==ch)return;

  }

  historyVisiblePairs=HISTORY_PAGE_PAIRS;
  chatReady=true;

  renderMessages();

// 会話を毎回全再描画するとスクロール位置が飛ぶため、新規メッセージはDOMへ追加する。
function messageInner(){return document.querySelector("#messages .messages-inner");}
function nodeFromHTML(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild;}
function nearChatBottom(tolerance=125){
  const el=document.getElementById("messages");
  return el.scrollHeight-el.scrollTop-el.clientHeight<tolerance;
}
// 通常のメッセージアプリと同じ追従方式。
// 見えない余白や未表示バブルを配置せず、実際に追加された要素の末尾まで移動する。
// 手動で履歴をさかのぼっている間は、画面位置を一切変更しない。
function scrollChatToEnd(smooth=false, force=false){
  const el=document.getElementById("messages");
  if(!el?.clientHeight||(!force&&userReadingHistory))return;
  const epoch=chatEpoch;
  requestAnimationFrame(()=>{
    if(epoch!==chatEpoch||!el.isConnected||(!force&&userReadingHistory))return;
    const end=Math.max(0,el.scrollHeight-el.clientHeight);
    if(Math.abs(el.scrollTop-end)<2)return;
    automaticChatScrollUntil=Date.now()+(smooth?700:100);
    el.scrollTo({top:end,behavior:smooth&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches?"smooth":"auto"});
  });
}
function appendChatNode(node,follow=false){
  const inner=messageInner();if(!inner)return;
  inner.append(node);
  if(follow)scrollChatToEnd(true);
}
function assistantRowHTML(ch,text,first=true,animate=false){

    <div class="bubble assistant">${esc(text)}</div></div>`;
}
function userRowHTML(ch,text,animate=false){

}
function suggestionHTML(ch,questions,initial=false){

  return `<div class="suggestions" aria-label="次の質問候補">
    <div class="suggestions-label">${initial?"💡 こんな質問をしてみよう":"💬 さらに聞いてみよう"}</div>
    <div class="suggestions-list">${questions.map(q=>`<button type="button" class="suggestion-btn" style="border:2px solid ${ch.color}38;color:${ch.color}" data-suggestion="${escAttr(q)}">${esc(q)}</button>`).join("")}</div>
  </div>`;
}
function typingHTML(ch){
  return `<div class="bubble-row assistant typing-row" role="status" aria-label="回答を作成しています">
    <div class="bubble-avatar" style="background:linear-gradient(135deg,${ch.color},${ch.accent})">${ch.emoji}</div>

}
function renderMessages(resetScroll=true){
  const ch=currentChar;if(!ch)return;
  // 保存済みの長い会話をすべて一度にDOM化せず、40往復ずつ遡れる。
  const olderCount=Math.max(0,Math.floor((messages.length-1)/2)-historyVisiblePairs);
  const visible=olderCount?messages.slice(1+olderCount*2):messages;
  const markup=visible.map((m,i)=>m.role==="user"?userRowHTML(ch,m.content):
    `<div class="bubble-group">${(olderCount===0&&i===0?[m.content]:splitReplyBubbles(m.content)).map((part,index)=>assistantRowHTML(ch,part,index===0)).join("")}</div>`).join("");
  const older=olderCount?`<button type="button" class="older-history" data-older="1">↑ 過去の会話を表示（残り${olderCount}往復）</button>`:"";
  const initial=messages.length<=1?ch.qs||[]:[];
  const followups=messages.length>1&&messages.at(-1)?.role==="assistant"?dynamicSuggestions:[];
  const el=document.getElementById("messages");
  el.innerHTML=`<div class="messages-inner">${older}${markup}${suggestionHTML(ch,initial,true)}${suggestionHTML(ch,followups)}</div>`;
  if(resetScroll){el.scrollTop=messages.length>1?el.scrollHeight:0;previousChatScroll=el.scrollTop;userReadingHistory=false;}
  updateSendBtn();
}

// 日本語の文末や段落を基準に分割。APIの回答自体はそのまま会話履歴に保持する。
function splitReplyBubbles(text){
  const source=String(text||"").replace(/\r\n?/g,"\n").trim();
  if(!source)return ["……"];
  const paragraphs=source.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  const pieces=[];
  for(const paragraph of paragraphs){
    const sentences=paragraph.match(/[^。！？!?]+[。！？!?]+[」』）】]?|[^。！？!?]+$/g)||[paragraph];
    for(let sentence of sentences){
      sentence=sentence.trim();if(!sentence)continue;
      while(sentence.length>120){
        const look=sentence.slice(0,107);
        let cut=Math.max(look.lastIndexOf("、"),look.lastIndexOf("，"),look.lastIndexOf("\n"),look.lastIndexOf(" "));
        if(cut<50)cut=95;else cut+=1;
        pieces.push(sentence.slice(0,cut).trim());sentence=sentence.slice(cut).trim();
      }
      if(sentence)pieces.push(sentence);
    }
    pieces.push(null); // 段落の境界でバブルを切る
  }
  const chunks=[];let current="";
  for(const piece of pieces){
    if(piece===null){if(current){chunks.push(current);current="";}continue;}
    if(current&&current.length+piece.length>100){chunks.push(current);current=piece;}
    else current+=piece;
  }
  if(current)chunks.push(current);
  return chunks.length?chunks:[source];
}
function makeRevealStatus(ch){
  return nodeFromHTML(`<div class="reveal-status" role="status" aria-label="続きの吹き出しを順番に表示しています">
    <div class="reveal-dots">${[0,.2,.4].map(d=>`<span class="typing-dot" style="background:${ch.color};animation-delay:${d}s"></span>`).join("")}</div>
    <button type="button" class="reveal-skip">すべて表示</button>
  </div>`);
}
// 回答は取得済みの1回分を、1つずつDOMに追加する。
// 以前の「未表示バブルをまとめて確保→先頭へ強制移動」は廃止。
// スクロールするのは会話の末尾のみ。回答が終わったら質問候補まで追従する。
function startReveal(ch,reply,suggestions){
  cancelReveal(false);
  const chunks=splitReplyBubbles(reply);
  const group=nodeFromHTML('<div class="bubble-group"></div>');
  appendChatNode(group,false);
  const state={group,ch,chunks,suggestions,index:0,timer:null,status:null};
  activeReveal=state;
  const addNext=()=>{
    if(activeReveal!==state||currentChar!==ch||!group.isConnected)return;
    state.status?.remove();state.status=null;
    const i=state.index++;
    group.append(nodeFromHTML(assistantRowHTML(ch,chunks[i],i===0,true)));
    if(state.index<chunks.length){
      state.status=makeRevealStatus(ch);
      group.append(state.status);
      const readingTime=Math.max(2600,Math.min(5000,chunks[i].length*48));
      state.timer=setTimeout(addNext,readingTime);
    }else{
      activeReveal=null;
      if(suggestions.length)group.after(nodeFromHTML(suggestionHTML(ch,suggestions)));
    }
    scrollChatToEnd(true);
  };
  // 回答の最初から表示する。先頭へのジャンプや表示前の画面移動はしない。
  addNext();
}
function cancelReveal(showRest=false,showQuestions=false){
  const state=activeReveal;if(!state)return;
  clearTimeout(state.timer);
  activeReveal=null;
  state.status?.remove();
  if(showRest){
    while(state.index<state.chunks.length){
      const i=state.index++;
      state.group.append(nodeFromHTML(assistantRowHTML(state.ch,state.chunks[i],i===0)));
    }
    if(showQuestions&&state.suggestions.length){
      state.group.after(nodeFromHTML(suggestionHTML(state.ch,state.suggestions)));
      scrollChatToEnd(true);
    }
  }
}

// ★ APIキーを使わず /api/chat（Vercel Serverless Function）に送信 ★
function cleanReplyText(value){
  // Keep normal historical prose, punctuation and angle brackets as text.
  // Remove only transport/formatting artifacts; display still passes through esc().
  return String(value||'').replace(/\r\n?/g,'\n')
    .replace(/\[\/?SUGGESTIONS\b[^\]]*\]/gi,'')
    .replace(/^\s*```(?:json|text|markdown)?\s*$/gim,'')
    .replace(/^\s{0,3}#{1,6}\s+/gm,'')
    .replace(/\*\*([^\n]+?)\*\*/g,'$1')
    .replace(/__([^\n]+?)__/g,'$1')
    .replace(/`([^`\n]+)`/g,'$1')
    .replace(/\n{3,}/g,'\n\n').trim();
}

function normalizeSuggestions(values,ch=currentChar,reply=''){
  if(!Array.isArray(values))return [];
  const seen=new Set();
  const key=s=>String(s).normalize('NFKC').replace(/[\s?？!！。、]/g,'').toLowerCase();
  // Do not suggest the same question again, even after restoring chat history.
  const asked=new Set(messages.filter(m=>m.role==='user').map(m=>key(m.content)));
  return values.filter(v=>typeof v==='string').map(value=>{
    let q=value.trim().replace(/^(?:[-•・]|\d+[.)、]|[①②③])\s*/, '');
    const subject=(ch?.isExplainer||ch?.isNarrator)?ch.name:'あなた';
    q=q.replace(/^(?:私|わし|余|朕|おれ|俺|拙者)(の|が|は)/,subject+'$1');
    if(ch?.isExplainer||ch?.isNarrator)q=q.replace(/あなた(の|が|は)/g,ch.name+'$1');
    q=q.replace(/(?:聞かせて|教えて|話して)ほしいの[？?]?$/,m=>m.split('ほしい')[0]+'？');
    q=q.replace(/\?$/,'？');
    if(!/[？?]$/.test(q)&&/(?:教えて|聞かせて|話して|知りたい|聞きたい)$/.test(q))q+='？';
    return q;
  }).filter(q=>{
    const k=key(q);
    if(q.length<6||q.length>60||!/[？?]$/.test(q)||/[\[\]{}<>\n\r]|SUGGESTIONS|```|\*\*/i.test(q))return false;
    if(seen.has(k)||asked.has(k)||key(reply)===k)return false;
    seen.add(k);return true;
  }).slice(0,3);
}

function getFallbackSuggestions(ch,reply=''){
  if(!ch)return [];
  const choices=ch.isSpecial
    ? ['今の説明をもっとやさしく教えて？','この出来事の前後の流れを教えて？','似ている言葉とのちがいを教えて？',...ch.qs]
    : ['今の説明をもっとやさしく教えて？',...ch.qs,'この話と同じ時代の出来事を教えて？','当時の人々の暮らしを教えて？'];
  return normalizeSuggestions(choices,ch,reply);
}

function completeSuggestions(values,ch,reply){
  return normalizeSuggestions([...normalizeSuggestions(values,ch,reply),...getFallbackSuggestions(ch,reply)],ch,reply);
}

// Recover only a completed JSON string field, never display an unfinished
// transport object. A truncated reply is treated as a failed answer by sendMessage.
function extractCompleteJsonString(raw,key){
  const escaped=key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const match=raw.match(new RegExp('"'+escaped+'"\\s*:\\s*("(?:\\\\[\\s\\S]|[^"\\\\])*")'));
  if(!match)return null;
  try{return JSON.parse(match[1]);}catch{return null;}
}

function parseSuggestions(value,ch=currentChar){
  let parsed=null,raw=typeof value==='string'?value.trim():'';
  if(value&&typeof value==='object'&&!Array.isArray(value))parsed=value;
  if(!parsed){
    const unfenced=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
    try{parsed=JSON.parse(unfenced);}catch{
      // Some models add a short preface despite the output contract.
      const first=unfenced.indexOf('{'),last=unfenced.lastIndexOf('}');
      if(first>=0&&last>first){try{parsed=JSON.parse(unfenced.slice(first,last+1));}catch{}}
    }
  }
  if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed)){
    const reply=typeof parsed.reply==='string'?parsed.reply:(typeof parsed.text==='string'?parsed.text:null);
    if(reply!==null){
      // Remove any accidentally nested legacy question section from the reply.
      const text=cleanReplyText(reply.split(/\[SUGGESTIONS\b/i)[0]);
      return {text,suggestions:completeSuggestions(parsed.suggestions,ch,text)};
    }
  }
  if(!raw)return {text:'',suggestions:[]};
  const jsonLike=raw.replace(/^```(?:json)?\s*/i,'').trim();
  if(/^\s*\{/.test(jsonLike)||/"(?:reply|suggestions)"\s*:/.test(jsonLike)){
    const reply=extractCompleteJsonString(jsonLike,'reply')??extractCompleteJsonString(jsonLike,'text');
    if(reply!==null){
      const text=cleanReplyText(reply.split(/\[SUGGESTIONS\b/i)[0]);
      return {text,suggestions:completeSuggestions([],ch,text)};
    }
    return {text:'',suggestions:[]};
  }
  // Legacy [SUGGESTIONS] is intentionally supported for existing API behavior.
  // Cut from the opening marker even when the closing marker never arrived.
  const marker=raw.search(/\[SUGGESTIONS\b/i);
  let candidates=[];
  if(marker>=0){
    const section=raw.slice(marker).replace(/^\[SUGGESTIONS\]?/i,'').split(/\[\/SUGGESTIONS\]/i)[0];
    candidates=section.split(/\||\n|(?=[①②③])/).map(s=>s.trim());
    raw=raw.slice(0,marker);
  }
  // Also hide a tag cut in the middle of its name at the very end.
  raw=raw.replace(/\[(?:\/?S(?:U(?:G(?:G(?:E(?:S(?:T(?:I(?:O(?:N(?:S)?)?)?)?)?)?)?)?)?)?)?\s*$/i,'');
  const text=cleanReplyText(raw);
  return {text,suggestions:completeSuggestions(candidates,ch,text)};
}

// LINE風効果音
let audioCtx=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playSendSound(){
  try{
    const ctx=getAudioCtx();const t=ctx.currentTime;
    // 柔らかい「ポコッ」— 丸みのある短いアタック
    const o=ctx.createOscillator();const g=ctx.createGain();
    const f=ctx.createBiquadFilter();
    o.connect(f);f.connect(g);g.connect(ctx.destination);
    f.type="lowpass";f.frequency.setValueAtTime(2000,t);
    o.type="sine";
    o.frequency.setValueAtTime(1400,t);
    o.frequency.exponentialRampToValueAtTime(800,t+0.07);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.18,t+0.008);
    g.gain.setValueAtTime(0.18,t+0.025);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
    o.start(t);o.stop(t+0.1);
  }catch(e){}
}
function playReceiveSound(){
  try{
    const ctx=getAudioCtx();const t=ctx.currentTime;
    // 「ティロリン♪」— 3音の明るい下降メロディ
    const notes=[{freq:1567.98,start:0,dur:0.1},{freq:1318.51,start:0.09,dur:0.1},{freq:1046.50,start:0.18,dur:0.18}];
    notes.forEach(n=>{
      const o=ctx.createOscillator();const g=ctx.createGain();
      const f=ctx.createBiquadFilter();
      o.connect(f);f.connect(g);g.connect(ctx.destination);
      f.type="lowpass";f.frequency.setValueAtTime(3000,t+n.start);
      o.type="triangle";
      o.frequency.setValueAtTime(n.freq,t+n.start);
      g.gain.setValueAtTime(0,t+n.start);
      g.gain.linearRampToValueAtTime(0.13,t+n.start+0.01);
      g.gain.setValueAtTime(0.13,t+n.start+n.dur*0.4);
      g.gain.exponentialRampToValueAtTime(0.001,t+n.start+n.dur);
      o.start(t+n.start);o.stop(t+n.start+n.dur);
    });
  }catch(e){}
}

async function sendMessage(text){
  if(!text||!text.trim()||isLoading||!currentChar||!chatReady)return;
  cancelReveal(true,false);
  const ch=currentChar,epoch=chatEpoch,question=text.trim();
  messageInner()?.querySelectorAll(".suggestions").forEach(n=>n.remove());
  messages.push({role:"user",content:question});
  document.getElementById("msg-input").value="";
  dynamicSuggestions=[];
  isLoading=true;
  userReadingHistory=false; // 自分が送信したときは最新メッセージへ戻す
  const userRow=nodeFromHTML(userRowHTML(ch,question,true));
  const typingRow=nodeFromHTML(typingHTML(ch));
  appendChatNode(userRow,false);
  appendChatNode(typingRow,false);
  // 送信直後は質問と入力中バブルが見える範囲まで。上へ強制ジャンプしない。
  scrollChatToEnd(true);
  updateSendBtn();
  playSendSound();
  try{
    const apiMessages=buildApiConversation(question);
    const res=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({characterId:ch.id,messages:apiMessages})
    });
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      throw new Error(err.error||res.status);
    }
    const data=await res.json();
    if(epoch!==chatEpoch||currentChar!==ch)return;
    const rawReply=data.content?.filter(b=>b.type==="text").map(b=>b.text).join("")||"……";
    const parsed=parseSuggestions(rawReply,ch);
    if(!parsed.text)throw new Error("回答を受け取りきれませんでした。もう一度送ってください。");
    messages.push({role:"assistant",content:parsed.text});
    dynamicSuggestions=parsed.suggestions;
    // API応答の完了した往復だけを保存。画面描画の完了を待つ必要はない。
    persistCurrentChat(ch);
    typingRow.remove();
    playReceiveSound();
    startReveal(ch,parsed.text,dynamicSuggestions);
  }catch(e){
    if(epoch!==chatEpoch||currentChar!==ch)return;
    // API障害の回答や未完了の質問を保存・次のAPIリクエストに混入させない。
    messages.pop();
    const message=`⚠️ 接続エラーが発生しました。(${e.message}) 質問を残しましたので、もう一度送信してください。`;
    dynamicSuggestions=[];
    typingRow.remove();userRow.remove();
    document.getElementById("msg-input").value=question;
    appendChatNode(nodeFromHTML(`<div class="error-msg" role="alert">${esc(message)}</div>`),true);
  }finally{
    if(epoch===chatEpoch&&currentChar===ch){isLoading=false;updateSendBtn();}
  }
}

function handleSend(){dynamicSuggestions=[];sendMessage(document.getElementById("msg-input").value);}

function updateSendBtn(){
  const btn=document.getElementById("send-btn"),val=document.getElementById("msg-input").value.trim();
  btn.disabled=!val||isLoading||!chatReady;
  if(!btn.disabled&&currentChar){
    btn.style.background=`linear-gradient(135deg,${currentChar.color},${currentChar.accent})`;
    btn.style.color="#fff";btn.style.boxShadow=`0 3px 10px ${currentChar.color}45`;
  }else{btn.style.background="#f1f5f9";btn.style.color="#94a3b8";btn.style.boxShadow="none";}
}

document.getElementById("msg-input").addEventListener("input",updateSendBtn);
document.getElementById("msg-input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();handleSend();}
});

function showProfile(){
  const ch=currentChar;
  const modal=document.getElementById("profile-modal");
  modal.innerHTML=`<div class="modal-overlay" id="modal-overlay" onclick="closeProfile(event)">
    <div class="modal-sheet" id="modal-sheet">
      <div class="modal-handle"></div>
      <button class="modal-close" onclick="closeProfile()">✕ 閉じる</button>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <div style="width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,${ch.color},${ch.accent});display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">${ch.emoji}</div>
        <div>
          <div style="font-weight:900;font-size:18px;color:#1e293b">${esc(ch.name)}</div>
          <div style="font-size:11px;color:#94a3b8;margin-top:2px">${esc(ch.period)}</div>
          <div style="font-size:12px;font-weight:800;color:${ch.color};margin-top:4px">「${esc(ch.catchphrase)}」</div>
        </div>
      </div>
      <div style="background:${ch.color}0d;border-left:4px solid ${ch.color};border-radius:0 12px 12px 0;padding:12px 14px;font-size:13px;color:#374151;line-height:1.8;font-weight:500">${esc(ch.bio)}</div>
    </div>
  </div>`;
  modal.classList.remove("hidden");
}

function closeProfile(e){
  if(e&&e.target!==document.getElementById("modal-overlay"))return;
  const overlay=document.getElementById("modal-overlay");
  const sheet=document.getElementById("modal-sheet");
  if(!overlay)return;
  overlay.classList.add("closing");
  sheet.classList.add("closing");
  setTimeout(()=>{
    document.getElementById("profile-modal").classList.add("hidden");
    document.getElementById("profile-modal").innerHTML="";
  },220);
}

renderTags();renderCards();

// iOS Safariの慣性スクロールやプログラムによるscrollイベントは、
// 「読書中のユーザーが最下部に戻った」根拠にしない。
const chatScroller=document.getElementById("messages");
let chatTouchStartY=null,chatUserMovingDown=false;
function pauseChatFollow(){
  userReadingHistory=true;
  chatUserMovingDown=false;
  automaticChatScrollUntil=0;
  // すでに開始したsmoothスクロールも止める。
  chatScroller.scrollTo({top:chatScroller.scrollTop,behavior:"instant"});
}
function resumeChatFollowIfAtBottom(){
  if(chatUserMovingDown&&nearChatBottom(45)){
    userReadingHistory=false;
    chatUserMovingDown=false;
  }
}
chatScroller.addEventListener("scroll",()=>{
  previousChatScroll=chatScroller.scrollTop;
  resumeChatFollowIfAtBottom();
},{passive:true});
chatScroller.addEventListener("wheel",e=>{
  if(e.deltaY<0)pauseChatFollow();
  else if(e.deltaY>0){chatUserMovingDown=true;resumeChatFollowIfAtBottom();}
},{passive:true});
chatScroller.addEventListener("touchstart",e=>{chatTouchStartY=e.touches?.[0]?.clientY??null;},{passive:true});
chatScroller.addEventListener("touchmove",e=>{
  const y=e.touches?.[0]?.clientY;
  if(y===undefined||chatTouchStartY===null)return;
  if(y>chatTouchStartY+8){pauseChatFollow();chatTouchStartY=y;}
  else if(y<chatTouchStartY-8){chatUserMovingDown=true;chatTouchStartY=y;resumeChatFollowIfAtBottom();}
},{passive:true});
chatScroller.addEventListener("touchend",()=>{chatTouchStartY=null;},{passive:true});
chatScroller.addEventListener("keydown",e=>{
  if(["ArrowUp","PageUp","Home"].includes(e.key))pauseChatFollow();
  else if(["ArrowDown","PageDown","End"].includes(e.key)){chatUserMovingDown=true;resumeChatFollowIfAtBottom();}
},{passive:true});

document.getElementById("messages").addEventListener("click",function(e){
  if(e.target.closest("[data-older]")){showOlderHistory();return;}
  const skip=e.target.closest(".reveal-skip");
  if(skip){cancelReveal(true,true);return;}
  const btn=e.target.closest(".suggestion-btn");
  if(btn&&btn.dataset.suggestion){sendMessage(btn.dataset.suggestion);}
});
</script>
